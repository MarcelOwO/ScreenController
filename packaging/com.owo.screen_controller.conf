<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>
  <!-- Allow root to own the service name and call bluez -->
  <policy user="root">
    <allow own="com.owo.screen_controller"/>
    <allow send_destination="org.bluez"/>
    <allow receive_sender="org.bluez"/>
  </policy>

  <!-- Allow the service to receive method calls from any local process -->
  <policy context="default">
    <allow send_destination="com.owo.screen_controller"/>
  </policy>
</busconfig>
